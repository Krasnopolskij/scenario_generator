services:
  neo4j:
    image: neo4j:5.25-community
    container_name: scenario_neo4j
    hostname: neo4j
    environment:
      # Учётные данные БД, задать в .env (NEO4J_AUTH=user/password)
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_initial_dbms_default__database=${NEO4J_DATABASE}
      # Настройки логирования Neo4j
      - NEO4J_db_logs_query_enabled=INFO      # OFF/INFO/VERBOSE
      - NEO4J_db_logs_query_threshold=2s
      - NEO4J_db_logs_query_parameter__logging__enabled=false
    ports:
      - "7474:7474"   # Веб-интерфейс Neo4j (HTTP)
      - "7687:7687"   # Протокол Bolt
    volumes:
      - neo4j_data:/data   # Данные БД
      - neo4j_logs:/logs   # Логи БД
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} -a bolt://localhost:7687 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 2m

  gnn:
    build:
      context: .
      dockerfile: docker/Dockerfile.gnn
    container_name: gnn
    depends_on:
      - neo4j
    env_file:
      - .env
    volumes:
      - gnn_data:/app/gnn_data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: scenario_app
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"   # Веб-UI приложения
    env_file:
      - .env
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  neo4j_data:
  neo4j_logs:
  gnn_data:
